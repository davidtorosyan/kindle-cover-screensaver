# Example nginx server block that serves the rotated cover.
# The Kindle will fetch http://your-server.example/kindle/cover.png
#
# Plain HTTP is deliberate: the Kindle's old wget may not support modern TLS.
# Keep this on your LAN, or restrict it to your Kindle's IP.

server {
    listen 80;
    server_name your-server.example;

    location /kindle/ {
        root /var/www;              # serves /var/www/kindle/cover.png
        location ~ /\. { deny all; }  # hide the .cover.png.source state file
        add_header Cache-Control "no-store";
    }
}

# No nginx? For a quick test, from /var/www run:
#   python3 -m http.server 8080
# and use http://your-server.example:8080/kindle/cover.png
